server {
    listen 8080;
	server_name www.example.com;

	error_page 404 ./www/error_pages/404.html;
	error_page 405 ./www/error_pages/405.html;
	error_page 500 ./www/error_pages/500.html;

	client_max_body_size 100M;

	location / {
		root ./www;
		index index.html;
		allowed_methods GET POST;
	}

	location /upload {
		root ./www/uploads;
		allowed_methods GET POST;
		upload_path ./www/uploads;
	}

	location /autoin {
	root ./src;
	autoindex on;
	allowed_methods GET;
	}

	location /redir {
		return 302 /autoin;
	}

	location /cgi-bin {
		root ./www;
		cgi_extension .py;
		# cgi_path /home/nmagomad/Webserv/www/.venv/bin/python3;
		#cgi_path /home/mnoah/projects/Webserv/www/.venv/bin/python3;
		cgi_path /usr/bin/python3;
		allowed_methods GET POST;
	}
}

