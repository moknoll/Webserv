server {
    listen 8080;
	server_name www.example.com;

	error_page 404 /error_pages/404.html;
	error_page 500 /error_pages/500.html;

	client_max_body_size 10M;

	location / {
		root ./www;
		index index.htm;
		allowed_methods GET POST;
	}

	location /uploads {
		root ./www/uploads;
		allowed_methods GET POST;
		upload_path ./www/uploads;
	}

	location /autoin {
	root ./src;
	autoindex on;
	allowed_methods GET;
	}

	location /redir {
		return 302 /autoin;
	}
}

