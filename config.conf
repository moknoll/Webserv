server {
    listen 8080;
	server_name www.example.com;

	error_page 404 ./www/error_pages/404.html;
	error_page 405 ./www/error_pages/405.html;
	error_page 500 ./www/error_pages/500.html;

	# return 302 http://google.com;

	client_max_body_size 2G;

	location / {
		root ./www;
		index index.html;
		allowed_methods GET POST;
	}

	location /upload {
		root ./www/uploads;
		allowed_methods GET POST;
		upload_path ./www/uploads;
	}

	location /autoin {
	root ./src;
	autoindex on;
	allowed_methods GET;
	}

	location /redir {
		return 302 /autoin;
	}

	location /redir-google {
		return 302 http://google.com;
	}


	location /cgi-bin {
		root ./www/py-scripts/;
		cgi_extension .php;
		cgi_path ./www/py-scripts/.venv/bin/python3;

		allowed_methods GET POST;
	}
}

