    <div class="box">
    <h1>Files upload on a Server</h1>
    <form action="/upload/" method="post" enctype="multipart/form-data">
            <label for="file">Choose file:</label>
            <input type="file" name="file" id="file" required>
        <button type="submit">Submit</button>
		</div>
    </form>

    <div id="result"></div>

    <script>
        const form = document.querySelector('form');
        const resultDiv = document.getElementById('result');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(form);
            
            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData
                });
                
                const text = await response.text();
                
                if (response.ok) {
                    resultDiv.innerHTML = `<div class="result success">✅ ${text}</div>`;
                    form.reset();
                } else {
                    resultDiv.innerHTML = `<div class="result error">❌ Error: ${text}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">❌ Connection Error: ${error.message}</div>`;
            }
        });
    </script>
</body>
