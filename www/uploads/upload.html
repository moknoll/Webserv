<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка файлов</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="file"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background-color: #dff0d8;
            border: 1px solid #3c763d;
            color: #3c763d;
        }
        .error {
            background-color: #f2dede;
            border: 1px solid #a94442;
            color: #a94442;
        }
    </style>
</head>
<body>
    <h1>Загрузка файла на сервер</h1>
    
    <form action="/cgi-bin/upload.py" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="file">Выберите файл:</label>
            <input type="file" name="file" id="file" required>
        </div>
        <button type="submit">Загрузить</button>
    </form>

    <div id="result"></div>

    <script>
        const form = document.querySelector('form');
        const resultDiv = document.getElementById('result');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(form);
            
            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: formData
                });
                
                const text = await response.text();
                
                if (response.ok) {
                    resultDiv.innerHTML = `<div class="result success">✅ ${text}</div>`;
                    form.reset();
                } else {
                    resultDiv.innerHTML = `<div class="result error">❌ Ошибка: ${text}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">❌ Ошибка соединения: ${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
