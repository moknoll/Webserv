<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>411 — Length Required</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background: #f5f6fa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #2f3640;
    }

    .container {
        text-align: center;
        padding: 40px 60px;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        max-width: 420px;
        width: 90%;
        animation: fadeIn 0.4s ease;
    }

    h1 {
        font-size: 28px;
        margin: 0 0 10px;
        font-weight: 700;
        color: #e84118;
    }

    p {
        font-size: 16px;
        margin: 0 0 20px;
        line-height: 1.5;
    }

    a {
        display: inline-block;
        margin-top: 10px;
        padding: 10px 18px;
        background: #e84118;
        color: #fff;
        text-decoration: none;
        border-radius: 8px;
        font-size: 14px;
        transition: background 0.2s ease;
    }

    a:hover {
        background: #c23616;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
<body>
    <div class="container">
        <h1>411 — Length Required</h1>
        <p>A valid Content-Length header is required.</p>
        <!-- <a> button is optional. we can or bind with index.html or delete it-->
        <a href="../index.html">Go Home</a>
    </div>
</body>
</html>
